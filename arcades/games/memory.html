<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Game Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          arcade: {
            bg: '#171022',
            alt: '#221830',
            card: '#251b35',
            gold: '#ffb84d',
            teal: '#5eead4',
            pink: '#ff6f9c',
            text: '#f4eeff',
            muted: '#a699c2',
          }
        },
        fontFamily: {
          pixel: ['"Press Start 2P"', 'cursive'],
          body: ['"Space Grotesk"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        }
      }
    }
  }
</script>

<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-arcade-bg text-arcade-text font-body min-h-screen antialiased">

  <div class="scanlines"></div>

  <main class="relative z-10 max-w-2xl mx-auto px-6 py-10 sm:py-14">

    <div class="flex items-center justify-between mb-10">
      <a href="../index.html"
         class="inline-flex items-center gap-2 font-mono text-xs text-arcade-muted hover:text-arcade-gold transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        KEMBALI KE MENU
      </a>
      <div class="flex items-center gap-1.5">
        <span class="font-mono text-xs text-arcade-teal" data-score="memory">HI: --</span>
      </div>
    </div>

    <header class="text-center mb-8">
      <p class="font-mono text-xs text-arcade-muted mb-2">CABINET 02</p>
      <h1 class="font-pixel text-lg sm:text-2xl text-arcade-gold drop-shadow-[0_0_16px_rgba(255,184,77,0.3)]">
        MEMORY MATCH
      </h1>
    </header>

    <section aria-label="Statistik" class="grid grid-cols-3 gap-3 mb-6">
      <div class="cabinet rounded-xl p-3 text-center">
        <p class="font-mono text-lg sm:text-xl text-arcade-teal" id="moves-count">0</p>
        <p class="font-mono text-[10px] text-arcade-muted mt-1">LANGKAH</p>
      </div>
      <div class="cabinet rounded-xl p-3 text-center">
        <p class="font-mono text-lg sm:text-xl text-arcade-text" id="timer">00:00</p>
        <p class="font-mono text-[10px] text-arcade-muted mt-1">WAKTU</p>
      </div>
      <div class="cabinet rounded-xl p-3 text-center">
        <p class="font-mono text-lg sm:text-xl text-arcade-gold" id="pairs-count">0/8</p>
        <p class="font-mono text-[10px] text-arcade-muted mt-1">PASANGAN</p>
      </div>
    </section>

    <p id="result-text" class="font-pixel text-center text-xs sm:text-sm text-arcade-muted mb-6 min-h-[2.5em] flex items-center justify-center px-2">
      Cari semua pasangannya.
    </p>

    <section aria-label="Papan kartu" class="cabinet rounded-2xl p-3 sm:p-4 mb-6">
      <div id="board" class="grid grid-cols-4 gap-2 sm:gap-3"></div>
    </section>

    <button type="button" id="reset-session"
            class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-arcade-alt border border-white/10 px-4 py-2.5 font-mono text-xs text-arcade-muted hover:text-arcade-pink hover:border-arcade-pink/40 transition-colors">
      <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
      KOCOK ULANG
    </button>

    <p class="text-center font-mono text-[10px] text-arcade-muted mt-6">
      HI menyimpan jumlah langkah tersedikit buat nyelesein papan.
    </p>

  </main>

  <script src="../js/shared.js"></script>
  <script src="../js/memory.js"></script>
</body>
</html>
